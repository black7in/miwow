# EventWow: ataques basicos a distancia de los heroes (docs/heroes.md, "Ataque basico"). Casilla 1 de la barra y
# clic derecho (EventWowDisguise). Se repiten solos (SPELL_ATTR2_AUTO_REPEAT): el intervalo es AttackSpeed de la ficha
# (eventwow_character), el dano es el del hechizo: min-max a nivel 1 + per_level por nivel. Los heroes cuerpo a cuerpo
# usan "Atacar" nativo (6603) con un arma invisible de la ficha: no estan aqui.
# Numeros PROVISIONALES.
#
# Rango de IDs: 9509020-9509039.

# --- Heroes con arma de distancia (Sylvanas): disparo fisico. Base: Disparo automatico (75). Familia de cazador (9,
# sin mascara: ningun talento le afecta): con ella el core lo trata como ataque a distancia (IsRangedWeaponSpell): poder
# de ataque a distancia y tabla de golpe de distancia. Conserva SPELL_ATTR0_USES_RANGED_SLOT y pide arco, escopeta,
# ballesta o arrojadiza equipados: el disfraz equipa de verdad el arma de distancia de la ficha (EventWowWeapons) y
# el CLIENTE anima el disparo segun ese arma y la saca a la mano (sin el atributo disparaba sin animar). Intervalo =
# velocidad del arma. Dano por hechizo (SCHOOL_DAMAGE fisico, no pide municion; WEAPON_DAMAGE usaria el dano del arma
# y la municion). Dano escalado a la velocidad de un arco (2,8 s): 40-60 / +8 a 2 s -> x1,4.
[[spell]]
id = 9509020
base = 75
family = 9
name = "Disparo automático"
description = "Dispara automáticamente al objetivo: $s1 de daño físico por disparo, más el poder de ataque a distancia."
visual = 557                     # flecha (20688)
icon = "INV_Weapon_Bow_07"       # la base (75) lleva 83 (Ability_Whirlwind): el cliente solo pone el arma en el 75
cast_time = 0
range = 35
ap_coefficient = 0.25
[spell.effect1]
type = "SCHOOL_DAMAGE"
target = "UNIT_TARGET_ENEMY"
min = 56
max = 84
per_level = 11.2
[spell.fields]
# spellgen limpia el arma requerida: aqui la de la base (arco, escopeta, ballesta) + arrojadiza
EquippedItemClass = 2
EquippedItemSubclass = 0x5000C   # 1<<2 arco | 1<<3 escopeta | 1<<16 arrojadiza | 1<<18 ballesta

