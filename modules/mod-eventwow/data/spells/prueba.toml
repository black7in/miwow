# --- Invocaciones (temporales, 30 s). Base: Espiritu feral (51533, efecto SUMMON delante del lanzador).
# Lo que decide el tipo es misc_b = fila de SummonProperties.dbc (Spell::EffectSummonType, Guardian::Guardian):
#   categoria PET (2) o tipo PET (1)  -> CONTROLABLE: barra de mascota (atacar/seguir/quieto), retrato de mascota.
#   categoria ALLY (1) + tipo GUARDIAN -> GUARDIAN: no se controla, sigue al dueno y pelea solo.
# misc = criatura invocada; value = cuantas.

# Controlable: 1 lobo espiritual (29264) con barra de mascota. SummonProperties 1561 (categoria PET, la del Maligno
# de las Sombras).
[[spell]]
id = 9500028
base = 51533
name = "Lobo de prueba"
description = "Invoca un lobo que obedece tus órdenes durante $d."
duration = 30
cooldown = 35
cost = 300
[spell.effect1]
value = 1
misc = 29264
misc_b = 1561

# No controlable: 2 arboles (Treant, 1964) que te siguen y pelean solos. SummonProperties 61 (ALLY, GUARDIAN).
[[spell]]
id = 9500029
base = 51533
name = "Guardianes de prueba"
description = "Invoca dos árboles que te protegen durante $d. No se pueden controlar."
icon = "Ability_Druid_ForceofNature"
duration = 30
cooldown = 35
cost = 300
[spell.effect1]
value = 2
misc = 1964
misc_b = 61
