[[spell]]
id = 9502003
base = 17                        # Palabra de poder: escudo (aspecto)
name = "Escudo"
description = "Te protege del siguiente cohete, rayo o mancha de aceite durante $d."
aura_description = "Protegido del siguiente golpe."
icon = "Spell_Holy_PowerWordShield"
duration = 10
# La base tiene Mechanic SHIELD y los vehiculos mecanicos son inmunes a ella (Vehicle::ApplyAllImmunities,
# Vehicle.cpp): con ella falla "no puedes hacer eso mientras eres inmune" (SPELL_FAILED_DAMAGE_IMMUNE)
mechanic = "NONE"
cooldown = 0
gcd = 0
script = "spell_eventwow_race_power"
[spell.effect1]
type = "APPLY_AURA"
aura = "DUMMY"
target = "UNIT_CASTER"
value = 0

