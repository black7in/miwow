# EventWow: poderes de la carrera (EventWowGameRace.cpp). Las cajas de la pista dan uno al azar; va al hueco 1 de la
# barra de la moto (m_spells del vehiculo) y lo lanza LA MOTO. Generar el SQL:
#   py -I tools/spellgen/spellgen.py build   (despues Build-Patch para el cliente)
#
# Rango de IDs: 9502000-9502099. 9502000-9502009 = activadores (barra), 9502010-9502019 = efectos.
#
# Ningun efecto necesita que los pilotos sean enemigos: el juego elige a quien afecta (el de delante, los que van por
# delante, quien pisa la mancha...) y el efecto se lo lanza la moto afectada a si misma. Asi tambien alcanza a los
# del mismo grupo (que el core siempre trata como amigos).

# --- Activadores: los lanza la moto desde su barra. spell_eventwow_race_power avisa al juego (quita el poder de la
# barra y hace lo suyo). Instantaneos, sin coste ni reutilizacion.

[[spell]]
id = 9502000
base = 25030                     # Disparar cohete
name = "Cohete"
description = "Dispara un cohete teledirigido al piloto que va justo delante (si vas primero, al de detrás): derrapa y se queda parado 1,5 s."
icon = "INV_Gizmo_RocketLauncher"
visual = 0
cast_time = 0
cooldown = 0
gcd = 0
speed = 0
max_targets = 0
script = "spell_eventwow_race_power"
[spell.fields]
InterruptFlags = 0
[spell.effect1]
type = "DUMMY"
target = "UNIT_CASTER"
value = 0

