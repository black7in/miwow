description = "Aumenta un $s1% la velocidad de movimiento con montura. No se acumula con otros efectos similares."
aura_description = "Velocidad con montura aumentada un $s1%."
icon = "Ability_Mount_RidingHorse"
duration = -1
gcd = 0
attributes_add = 0x40            # pasivo (SPELL_ATTR0_PASSIVE): libro de hechizos, sin icono de beneficio
[spell.fields]
DispelType = 0
InterruptFlags = 0
[spell.effect1]
aura = "MOD_MOUNTED_SPEED_NOT_STACK"
target = "UNIT_CASTER"
value = 10
misc = 0
[spell.effect2]
type = "NONE"
[spell.effect3]
