# MiWow: ventajas (perks) de temporada de hermandad (src/guild/MiWowGuildSeason.cpp, tabla miwow_guild_perk). Basadas
# en las ventajas de hermandad de Cataclysm. Generar el SQL:
#   py -I tools/spellgen/spellgen.py build   (despues Build-Patch para el cliente)
#
# Rango de IDs: 9504000-9504099.
#
# Todas son hechizos PASIVOS (como los raciales) que los miembros de la hermandad aprenden mientras la temporada tenga
# la ventaja desbloqueada (RefreshPerks; libro de hechizos, pestana General). El aura pasiva no se envia al cliente:
# no sale en los beneficios. Valen en todas partes (tambien eventos, campos de batalla y arenas). Las ventajas con el
# mismo efecto son rangos: solo se sabe la mas alta.
#   - Efecto nativo del aura (lo hace el core): montura, experiencia, reputacion, honor.
#   - Efecto del modulo (aura DUMMY de marca): el modulo lee el valor del efecto 1 de ESTE hechizo ($s1), asi el
#     tooltip y lo que se aplica no se separan nunca. El efecto lo dice miwow_guild_perk.Effect.
# Base comun: Serenata Cantaflor (15366); se cambian los efectos y se hace pasivo.

[[spell]]
id = 9504000
base = 15366
