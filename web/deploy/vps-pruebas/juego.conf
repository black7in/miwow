# /etc/apache2/sites-available/juego.conf  (VPS de pruebas, ver docs/despliegue-vps-pruebas.md)
# Cliente web de MiWow: todo a server.js (127.0.0.1:8080). server.js pone el mismo las cabeceras COOP/COEP/CORP.
# Requiere: a2enmod proxy proxy_http proxy_wstunnel headers. HTTPS: sudo certbot --apache -d juego.miwow.duckdns.org
# (certbot copia este bloque a juego-le-ssl.conf y anade aqui la redireccion a https).
<VirtualHost *:80>
    ServerName juego.miwow.duckdns.org
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/

    # Tunel del juego (WebSocket -> TCP al authserver/worldserver). Sin corte por inactividad de Apache:
    # server.js cierra el solo los tuneles inactivos (wsIdleTimeoutSec).
    ProxyPass        /tcp/ ws://127.0.0.1:8080/tcp/ timeout=1000
    ProxyPass        / http://127.0.0.1:8080/ timeout=300
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Los bloques de los MPQ ya van comprimidos: que mod_deflate no los toque
    SetEnvIf Request_URI "^/(blocks|game)/" no-gzip
    # PUT /userdata (WTF, SavedVariables): hasta 20 MB por jugador (maxUserdataMB)
    LimitRequestBody 22020096

    ErrorLog ${APACHE_LOG_DIR}/juego_error.log
    CustomLog ${APACHE_LOG_DIR}/juego_access.log combined
</VirtualHost>
